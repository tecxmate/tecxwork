<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 1.1s infinite; }
    .eye-r { animation-delay: 0.04s; }
    .eyes { animation: dart 1.4s infinite ease-in-out; transform-origin: 256px 310px; }
    @keyframes blink {
      0%, 70%, 100% { transform: scaleY(1); }
      80% { transform: scaleY(0.08); }
      90% { transform: scaleY(1); }
    }
    @keyframes dart {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      50% { transform: translateX(0); }
      75% { transform: translateX(7px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .eye, .eyes { animation: none; }
    }
  </style>
  <rect width="512" height="512" rx="104" fill="#8C52FF"/>
  <rect x="132" y="190" width="248" height="192" rx="34" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linejoin="round"/>
  <path d="M198 190v-28c0-18 14-32 32-32h52c18 0 32 14 32 32v28" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M132 256h248" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round"/>
  <g class="eyes">
    <path class="eye" d="M216 286v48" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
    <path class="eye eye-r" d="M296 286v48" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
  </g>
</svg>
