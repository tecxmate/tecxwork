name: CI

on:
  push:
    branches: [main, demo/yang-luck]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # The suite talks to a real Postgres — the schema is the thing under test in
    # most of these files (partial unique indexes, FK cascades, lock behaviour),
    # so a mock would verify nothing. src/lib/db picks the plain `pg` driver for a
    # localhost URL and Neon's WebSocket driver otherwise, so this needs no app change.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tecxwork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tecxwork_test
      JWT_SECRET: ci-secret-do-not-use-in-prod

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # schema.ts is the source of truth — `drizzle/` is gitignored, so the test
      # database is built by pushing the schema rather than replaying migrations.
      - name: Push schema to the test database
        run: npx drizzle-kit push --force
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # Must run before tsc: next-env.d.ts is gitignored and generated by the build.
      # Without it, `tsc --noEmit` reports ~25 phantom "cannot find module 'next/server'"
      # errors on a clean checkout.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Typecheck
        run: npx tsc --noEmit

      # src/test/setup.ts refuses to run when TEST_DATABASE_URL === DATABASE_URL, so a
      # misconfigured run can never truncate a real database. DATABASE_URL is set to a
      # deliberately unreachable placeholder to satisfy that guard; setup.ts then points
      # the app's db client at TEST_DATABASE_URL itself.
      - name: Test
        run: npm test
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:1/unused
